name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check repository for secrets
        run: python scripts/check_secrets.py
      - name: Build and start the complete demo
        run: docker compose up --build --wait -d
      - name: Financial and database checks
        run: docker compose run --rm -e RUN_DB_TESTS=1 -e AI_ENABLED=false api python -m unittest discover -s tests -v
      - name: Install browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Desktop and mobile journey
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
      - name: Stop services
        if: always()
        run: docker compose down
