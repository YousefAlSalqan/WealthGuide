name: wealthguide
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealthguide
      POSTGRES_USER: wealthguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealthguide-local-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthguide -d wealthguide"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://wealthguide:${POSTGRES_PASSWORD:-wealthguide-local-only}@db:5432/wealthguide
      OPENAI_API_KEY_FILE: /run/secrets/openai_key
      AI_ENABLED: ${AI_ENABLED:-true}
    secrets:
      - openai_key
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
secrets:
  openai_key:
    file: ${OPENAI_API_KEY_FILE:-.env.example}
volumes:
  postgres_data:
